name: GameSession contract

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'docs/domain/game-session-serialization.md'
      - '.github/workflows/game-session-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run GameSession contract tests
        run: npm run test:contract

      - name: Run complete test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
