name: GameSession contract

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'docs/domain/game-session-serialization.md'
      - '.github/workflows/game-session-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GameSession contract tests
        run: npm run test:contract

      - name: Run complete test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
