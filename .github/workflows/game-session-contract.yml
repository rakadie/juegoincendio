name: Vertical Beta 1 acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertical-beta-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the complete M5 acceptance gate
        run: npm run accept:m5

      - name: Run the M5 visual browser smoke
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3001
          npm start >/tmp/m5-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            cat /tmp/m5-server.log || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          mkdir -p artifacts/m5-visual
          CHROME_BIN="$CHROME_BIN" \
            M4_BASE_URL=http://127.0.0.1:3001 \
            M5_CAPTURE_DIR=artifacts/m5-visual \
            npm run smoke:m5

      - name: Upload M5 visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m5-visual-evidence
          path: artifacts/m5-visual
          if-no-files-found: warn
          retention-days: 14
