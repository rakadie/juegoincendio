name: Sync Project status

on:
  issues:
    types:
      - opened
      - reopened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
  pull_request_target:
    types:
      - opened
      - edited
      - ready_for_review
      - converted_to_draft
      - closed
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number. Leave empty to rescan open issues with explicit dependencies.
        required: false
        type: number
      status:
        description: Status to apply, or auto to calculate it.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - Backlog
          - Ready
          - In Progress
          - Done

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-status-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-project-status:
    runs-on: ubuntu-latest
    env:
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_STATUS_FIELD: ${{ vars.PROJECT_STATUS_FIELD || 'Status' }}
      PROJECT_STATUS_BACKLOG: ${{ vars.PROJECT_STATUS_BACKLOG || 'Backlog' }}
      PROJECT_STATUS_READY: ${{ vars.PROJECT_STATUS_READY || 'Ready' }}
      PROJECT_STATUS_IN_PROGRESS: ${{ vars.PROJECT_STATUS_IN_PROGRESS || 'In Progress' }}
      PROJECT_STATUS_DONE: ${{ vars.PROJECT_STATUS_DONE || 'Done' }}

    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4

      - name: Validate Project configuration
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PROJECTS_TOKEN" ]]; then
            echo "Missing repository secret PROJECTS_TOKEN" >&2
            exit 1
          fi

          if [[ -z "$PROJECT_NUMBER" ]]; then
            echo "Missing repository variable PROJECT_NUMBER" >&2
            exit 1
          fi

      - name: Synchronize Project Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const synchronize = require('./.github/scripts/project-status-sync.js');
            await synchronize({ github, context, core });
