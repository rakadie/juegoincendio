version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      npm-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
